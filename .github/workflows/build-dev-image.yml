name: Build Dev Image and Push to GHCR

on:
  push:
    branches:
      - dev*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-dev:
    name: Build and Push Dev Image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.name }}
      branch: ${{ steps.img.outputs.branch }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name and branch tag
        id: img
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # Branch names allow characters that are invalid in a Docker tag (e.g. '/').
          echo "branch=$(echo "${GITHUB_REF_NAME,,}" | sed 's#[^a-z0-9._-]#-#g')" >> "$GITHUB_OUTPUT"

      - name: Build and push dev image (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ steps.img.outputs.branch }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=mira-oxide ${{ github.ref_name }} image (${{ matrix.arch }})
          provenance: false
          cache-from: type=gha,scope=${{ steps.img.outputs.branch }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ steps.img.outputs.branch }}-${{ matrix.arch }}

  create-dev-manifest:
    name: Create Dev Image Manifest
    needs: build-dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push dev manifest
        shell: bash
        env:
          REPO: ${{ env.REGISTRY }}/${{ needs.build-dev.outputs.image }}
          BRANCH: ${{ needs.build-dev.outputs.branch }}
        run: |
          docker buildx imagetools create -t "${REPO}:${BRANCH}" \
            "${REPO}:${BRANCH}-x86_64" \
            "${REPO}:${BRANCH}-aarch64"
